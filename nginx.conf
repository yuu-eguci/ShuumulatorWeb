server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /ShuumulatorWeb/;
    }

    # GitHub Pages と同じく /ShuumulatorWeb/ 配下で SPA を配信します。
    location /ShuumulatorWeb/ {
        try_files $uri $uri/ /ShuumulatorWeb/index.html;
    }
}
